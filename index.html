    <!-- Preload the LCP element (hero portrait). The <img> is rendered by
         React inside a <picture>, so without this the AVIF fetch would not
         start until JS has mounted, delaying LCP. -->
    <link
      rel="preload"
      as="image"
      href="/assets/alhassan_mohamed.avif"
      imagesrcset="/assets/alhassan_mohamed.avif"
      imagesizes="(max-width: 640px) 384px, 420px"
      fetchpriority="high"
    />

    <!-- Pre-paint theme & language bootstrap: prevents a flash of the wrong
         theme/direction before React mounts. Mirrors the initial-state logic
         in ThemeContext / LanguageContext. -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var savedTheme = localStorage.getItem('portfolio-theme');
          var theme = savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          var savedLang = localStorage.getItem('portfolio_lang');
          if (savedLang === 'ar' || savedLang === 'en') {
            root.lang = savedLang;
            root.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
